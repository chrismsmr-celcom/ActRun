# crates/actrun-trace/Cargo.toml
[package]
name = "actrun-trace"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Trace analyzer for ActRun event logs"

[[bin]]
name = "actrun-trace"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
