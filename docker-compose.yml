services:
  cohort:
    build:
      context: .
      dockerfile: python/Dockerfile
    image: cerbere-cohort:local
    restart: unless-stopped
    environment:
      COHORT_DB_PATH: /data/cohort.db
      COHORT_REQUIRE_LEASES: "true"
      COHORT_TELEMETRY: "${COHORT_TELEMETRY:-false}"
      COHORT_TELEMETRY_URL: "${COHORT_TELEMETRY_URL:-}"
      COHORT_TELEMETRY_ID_PATH: /data/telemetry-id
    ports:
      # Local-only by default. Do not expose this unauthenticated SQLite mode publicly.
      - "127.0.0.1:8000:8000"
    volumes:
      - cohort-data:/data

volumes:
  cohort-data:
