[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actrun-mcp-server"
version = "0.1.0"
description = "MCP server exposing ActRun coordination tools to LLMs"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "actrun",  # Ton package local (installé avec pip install -e)
]

[project.scripts]
actrun-mcp = "mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
