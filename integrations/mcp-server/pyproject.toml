[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerbere-cohort-mcp-server"
version = "0.2.0"
description = "Persistent multi-agent coordination MCP server for Cerbere Cohort"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9.0,<2.0.0",
    "cerbere-cohort[postgres]",
]

[project.scripts]
cerbere-cohort-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server"]

[tool.setuptools.packages.find]
where = ["src"]
