[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerbere-cohort-mcp-server"
version = "0.1.0"
description = "MCP server exposing Cerbere Cohort coordination tools to LLMs"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "cerbere-cohort",  # Ton package local (installé avec pip install -e)
]

[project.scripts]
cerbere-cohort-mcp = "mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
