name: Archive GitHub traffic

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect repository traffic
        env:
          COHORT_TRAFFIC_TOKEN: ${{ secrets.COHORT_TRAFFIC_TOKEN }}
        run: python scripts/collect_github_traffic.py
      - name: Commit daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/github-traffic.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(metrics): archive GitHub traffic"
            git push
          fi
