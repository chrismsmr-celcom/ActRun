# python/pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerbere-cohort"
version = "0.1.0"
description = "Shared-state and conflict-aware coordination for multi-agent systems."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",  # Pour la validation robuste des événements
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",  # Pour le formatage et le linting
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
